name: asr-check
on:
  push:
    paths: ['fetch/asr.txt']
permissions:
  contents: write
jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir -p fetch/asr; L=fetch/asr/log.txt; date > $L
          (which ffmpeg || (pip install -q imageio-ffmpeg && sudo ln -sf $(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())') /usr/local/bin/ffmpeg) || (timeout 300 sudo apt-get install -y -qq ffmpeg)) >> $L 2>&1
          pip install -q faster-whisper >> $L 2>&1
          python3 .github/asr_check.py >> $L 2>&1
          git config user.name "Hatartcg"; git config user.email "hseyam.m@gmail.com"
          git add -A fetch/asr && git commit -m "asr check"; for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 6; done
